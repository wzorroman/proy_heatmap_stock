<article class="card">
  <h2>{% if chart_code('health') %}<span class="chart-code">{{ chart_code('health') }}</span>{% endif %}{{ titulo }}</h2>
  <ul class="health-list">
    {% for r in rows %}
    <li class="health-item">
      <span class="health-mod">{{ r.modulo }}</span>
      <span class="estado {{ r.estado_clase }}">{{ r.estado }}</span>
      <span class="health-detalle">{{ r.detalle }}</span>
    </li>
    {% endfor %}
  </ul>
</article>
