<article class="card">
  <h2>Movimiento FX / Macro</h2>

  <div class="sub">Movimiento FX / Macro</div>
  <ul class="kv">
    {% for f in fx %}
    <li>
      <span>{{ f.clave }} <span class="muted">{{ f.nota }}</span></span>
      <b class="{{ 'pos' if f.change_pct >= 0 else 'neg' }}">
        {{ '%+.2f'|format(f.change_pct) }}%
        <span class="muted">{{ '▲' if f.change_pct > 0 else ('▼' if f.change_pct < 0 else '▶') }}</span>
      </b>
    </li>
    {% endfor %}
    {% if not fx %}<li><span class="muted">Sin datos FX/Macro.</span></li>{% endif %}
  </ul>
</article>
